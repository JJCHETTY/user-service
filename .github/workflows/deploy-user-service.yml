name: Deploy User Service

on:
  push:
    branches: ["main"]
    paths:
      - "user-service/**"
      - ".github/workflows/deploy-user-service.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/user-service
  RESOURCE_GROUP: recipe-app-rg
  CONTAINER_APP_ENV: recipe-app-env
  CONTAINER_APP_NAME: user-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: user-service/pom.xml

      - name: Build Quarkus App
        working-directory: ./user-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        working-directory: ./user-service
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            -f src/main/docker/Dockerfile.jvm \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push --all-tags "$IMAGE"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ steps.image.outputs.name }}:${{ github.sha }}
          targetPort: 8081
          ingress: external
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GH_PAT }}
          environmentVariables: |
            QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://recipe-db-server-123.postgres.database.azure.com:5432/user_db?sslmode=require
            QUARKUS_DATASOURCE_USERNAME=${{ secrets.DB_USER }}
            QUARKUS_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            QUARKUS_OIDC_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            QUARKUS_OIDC_CREDENTIALS_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            LOGIN_SUCCESS_URI=${{ secrets.LOGIN_SUCCESS_URI }}
            JWT_PRIVATE_KEY_LOCATION=/mnt/secrets/jwt-private-key
            JWT_PUBLIC_KEY_LOCATION=/mnt/secrets/jwt-public-key
