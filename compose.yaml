services:
  user-service:
    build:
      context: ./user-service
      dockerfile: src/main/docker/Dockerfile.jvm
    env_file:
      - ./user-service/.env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://host.docker.internal:5433/user_db
      JWT_PRIVATE_KEY_LOCATION: /deployments/keys/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: /deployments/keys/publicKey.pem
    ports:
      - "8081:8081"
    volumes:
      - ./user-service/keys:/deployments/keys:ro
