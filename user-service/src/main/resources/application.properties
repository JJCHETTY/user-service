quarkus.application.name=user-service
quarkus.http.port=8081
quarkus.http.proxy.proxy-address-forwarding=true

quarkus.http.auth.permission.authenticated.paths=/api/v1/users/*,/api/v1/auth/login
quarkus.http.auth.permission.authenticated.policy=authenticated

# Database configuration
quarkus.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/user_db}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:user-service-test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.oidc.enabled=false
%test.mp.jwt.verify.publickey.location=target/test-jwt-keys/public.pem
%test.smallrye.jwt.sign.key.location=target/test-jwt-keys/private.pem

# Google OIDC configuration
quarkus.oidc.application-type=web-app
quarkus.oidc.provider=google
quarkus.oidc.client-id=${GOOGLE_CLIENT_ID}
quarkus.oidc.credentials.secret=${GOOGLE_CLIENT_SECRET}
quarkus.oidc.authentication.user-info-required=true
quarkus.oidc.authentication.scopes=email,profile
quarkus.oidc.authentication.redirect-path=/api/v1/auth/callback

# OIDC callbacks have no JAX-RS resource; protect the path so Quarkus handles it.
quarkus.http.auth.permission.oidc-callback.paths=/api/v1/auth/callback
quarkus.http.auth.permission.oidc-callback.policy=authenticated

app.login-success-uri=${LOGIN_SUCCESS_URI:http://localhost:4200/login-success}

# Internal JWT configuration; provide matching keys through deployment configuration.
mp.jwt.verify.issuer=https://recipe-app.com/issuer
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:/mnt/secrets/jwt-public-key}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:/mnt/secrets/jwt-private-key}
smallrye.jwt.new-token.issuer=https://recipe-app.com/issuer
smallrye.jwt.new-token.lifespan=3600

# Production startup validates the schema; provision it before deployment.
%prod.quarkus.hibernate-orm.schema-management.strategy=validate